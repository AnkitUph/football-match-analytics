{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password | Football Analytics</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
    body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
        padding: 20px;
    }
    .card {
        background: #ffffff;
        width: 100%;
        max-width: 420px;
        border-radius: 12px;
        padding: 40px 32px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }
    .card h1 {
        font-size: 22px;
        color: #1a1a1a;
        margin-bottom: 8px;
        text-align: center;
    }
    .card p.subtitle {
        font-size: 14px;
        color: #666;
        text-align: center;
        margin-bottom: 28px;
    }
    .form-group { margin-bottom: 20px; }
    label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: #333;
        margin-bottom: 6px;
    }
    input[type="email"] {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #d9d9d9;
        border-radius: 8px;
        font-size: 14px;
        outline: none;
        transition: border-color 0.2s;
    }
    input[type="email"]:focus {
        border-color: #2c5364;
    }
    button {
        width: 100%;
        padding: 12px;
        background: #203a43;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
    }
    button:hover { background: #16262b; }
    .back-link {
        display: block;
        text-align: center;
        margin-top: 20px;
        font-size: 13px;
        color: #2c5364;
        text-decoration: none;
    }
    .back-link:hover { text-decoration: underline; }
    .messages { list-style: none; margin-bottom: 20px; }
    .messages li {
        padding: 10px 14px;
        border-radius: 8px;
        font-size: 13px;
        margin-bottom: 8px;
    }
    .messages li.success { background: #e6f7ed; color: #1a7f4e; border: 1px solid #b3e6c9; }
    .messages li.error { background: #fdeaea; color: #c0392b; border: 1px solid #f5c2c2; }
</style>
</head>
<body>
    <div class="card">
        <h1>Forgot Password?</h1>
        <p class="subtitle">Enter your email and we'll send you a link to reset your password.</p>

        {% if messages %}
        <ul class="messages">
            {% for message in messages %}
            <li class="{{ message.tags }}">{{ message }}</li>
            {% endfor %}
        </ul>
        {% endif %}

        <form method="POST" action="{% url 'accounts:forgot_password' %}">
            {% csrf_token %}
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required>
            </div>
            <button type="submit">Send Reset Link</button>
        </form>

        <a href="{% url 'accounts:login' %}" class="back-link">← Back to Login</a>
    </div>
</body>
</html>
