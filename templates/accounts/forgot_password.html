<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — Football Match Analytics Studio</title>
    <meta name="description" content="Reset your Football Match Analytics Studio account password securely.">
    <!-- Google Fonts: Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #080c0e;
            --bg-surface: #0f1519;
            --bg-card: rgba(18, 25, 30, 0.78);
            --border-glass: rgba(255, 255, 255, 0.08);
            --border-focus: #10b981;
            --pitch-emerald: #10b981;
            --pitch-emerald-glow: rgba(16, 185, 129, 0.28);
            --pitch-cyan: #06b6d4;
            --accent-gradient: linear-gradient(135deg, #10b981 0%, #06b6d4 100%);
            --text-main: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --card-radius: 18px;
            --transition-smooth: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
            padding: 32px 20px;
        }

        /* Subtle Tactical Pitch Grid Background */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(16, 185, 129, 0.12) 0%, transparent 60%),
                radial-gradient(circle at 100% 100%, rgba(6, 182, 212, 0.08) 0%, transparent 50%),
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 48px 48px, 48px 48px;
            pointer-events: none;
            z-index: 0;
        }

        /* Tactical Pitch Circle Graphic Accent */
        .pitch-circle {
            position: fixed;
            width: 480px;
            height: 480px;
            border: 1px dashed rgba(16, 185, 129, 0.14);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 0;
        }

        .auth-container {
            width: 100%;
            max-width: 450px;
            position: relative;
            z-index: 1;
            margin: auto;
        }

        /* Brand Header */
        .brand-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.15) 0%, rgba(6, 182, 212, 0.15) 100%);
            border: 1px solid rgba(16, 185, 129, 0.35);
            box-shadow: 0 0 24px var(--pitch-emerald-glow);
            margin-bottom: 14px;
        }

        .brand-badge svg {
            width: 28px;
            height: 28px;
            color: var(--pitch-emerald);
        }

        .brand-title {
            font-family: 'Outfit', sans-serif;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .brand-title span {
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-subtitle {
            font-size: 13.5px;
            color: var(--text-secondary);
            font-weight: 400;
            line-height: 1.45;
            max-width: 360px;
            margin: 0 auto;
        }

        /* Glassmorphic Card */
        .glass-card {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: var(--card-radius);
            padding: 34px 30px;
            box-shadow: 
                0 20px 40px -15px rgba(0, 0, 0, 0.6),
                0 0 1px 1px rgba(255, 255, 255, 0.05) inset;
        }

        /* Flash Message Banners */
        .message-banner {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 13px;
            line-height: 1.45;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideDown 0.3s ease-out;
        }

        .message-error {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.35);
            color: #fca5a5;
        }

        .message-success {
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.35);
            color: #6ee7b7;
        }

        .message-info {
            background: rgba(6, 182, 212, 0.12);
            border: 1px solid rgba(6, 182, 212, 0.35);
            color: #67e8f9;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Form Styling */
        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 12.5px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 7px;
            letter-spacing: 0.01em;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            width: 18px;
            height: 18px;
            color: var(--text-muted);
            pointer-events: none;
            transition: var(--transition-smooth);
        }

        .form-input {
            width: 100%;
            background: rgba(10, 14, 18, 0.7);
            border: 1px solid var(--border-glass);
            border-radius: 11px;
            padding: 12px 14px 12px 42px;
            font-size: 14px;
            color: var(--text-main);
            outline: none;
            transition: var(--transition-smooth);
        }

        .form-input:focus {
            border-color: var(--pitch-emerald);
            background: rgba(12, 17, 22, 0.95);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.18);
        }

        .form-input:focus + .input-icon,
        .input-wrapper:focus-within .input-icon {
            color: var(--pitch-emerald);
        }

        .form-input::placeholder {
            color: #475569;
        }

        /* Submit Button */
        .btn-submit {
            width: 100%;
            background: var(--accent-gradient);
            border: none;
            border-radius: 11px;
            padding: 13px;
            font-size: 14.5px;
            font-weight: 600;
            color: #041210;
            cursor: pointer;
            transition: var(--transition-smooth);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 18px var(--pitch-emerald-glow);
            margin-top: 8px;
        }

        .btn-submit:hover {
            transform: translateY(-1.5px);
            box-shadow: 0 6px 24px rgba(16, 185, 129, 0.45);
            filter: brightness(1.06);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-submit svg {
            width: 18px;
            height: 18px;
            stroke-width: 2.2;
        }

        /* Back Link Action */
        .back-link-wrapper {
            margin-top: 22px;
            text-align: center;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13.5px;
            color: var(--text-secondary);
            text-decoration: none;
            transition: var(--transition-smooth);
        }

        .back-link svg {
            width: 16px;
            height: 16px;
            transition: transform 0.2s ease;
        }

        .back-link:hover {
            color: var(--pitch-cyan);
        }

        .back-link:hover svg {
            transform: translateX(-3px);
        }

        /* Loading spinner */
        .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(4, 18, 16, 0.3);
            border-radius: 50%;
            border-top-color: #041210;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .is-submitting .spinner {
            display: inline-block;
        }
        .is-submitting .btn-text,
        .is-submitting .btn-icon {
            display: none;
        }
    </style>
</head>
<body>
    <div class="pitch-circle"></div>

    <div class="auth-container">
        <!-- Brand Header -->
        <div class="brand-header">
            <div class="brand-badge">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />
                </svg>
            </div>
            <h1 class="brand-title">Reset <span>Password</span></h1>
            <p class="brand-subtitle">Enter your verified account email to receive a secure password recovery link</p>
        </div>

        <!-- Glass Card -->
        <div class="glass-card">
            <!-- Django Messages -->
            {% if messages %}
                {% for message in messages %}
                    <div class="message-banner {% if message.tags == 'error' %}message-error{% elif message.tags == 'success' %}message-success{% else %}message-info{% endif %}">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink: 0;">
                            {% if message.tags == 'error' %}
                                <circle cx="12" cy="12" r="10"></circle>
                                <line x1="12" y1="8" x2="12" y2="12"></line>
                                <line x1="12" y1="16" x2="12.01" y2="16"></line>
                            {% elif message.tags == 'success' %}
                                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                            {% else %}
                                <circle cx="12" cy="12" r="10"></circle>
                                <line x1="12" y1="16" x2="12.01" y2="12"></line>
                                <line x1="12" y1="8" x2="12.01" y2="8"></line>
                            {% endif %}
                        </svg>
                        <span>{{ message }}</span>
                    </div>
                {% endfor %}
            {% endif %}

            <!-- Form -->
            <form method="POST" action="{% url 'accounts:forgot_password' %}" id="forgotPasswordForm">
                {% csrf_token %}

                <div class="form-group">
                    <label class="form-label" for="email">Account Email Address</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                        </svg>
                        <input 
                            type="email" 
                            name="email" 
                            id="email" 
                            class="form-input" 
                            placeholder="you@domain.com" 
                            required 
                            autofocus 
                            autocomplete="email"
                        >
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">
                    <span class="btn-text">Send Recovery Link</span>
                    <svg class="btn-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                    </svg>
                    <div class="spinner"></div>
                </button>
            </form>

            <div class="back-link-wrapper">
                <a href="{% url 'accounts:login' %}" class="back-link">
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                    </svg>
                    Return to Sign In
                </a>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('forgotPasswordForm');
        const submitBtn = document.getElementById('submitBtn');
        form.addEventListener('submit', function() {
            submitBtn.classList.add('is-submitting');
            submitBtn.disabled = true;
        });
    </script>
</body>
</html>
