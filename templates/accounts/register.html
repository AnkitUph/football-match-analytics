<!DOCTYPE html>
<html>

<head>
    <title>Register</title>
</head>

<body>

    <h1>Create Account</h1>

    {% if messages %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <label>Username</label>
        <br>
        <input
            type="text"
            name="username"
            required
        >
        <br><br>

        <label>Email</label>
        <br>
        <input
            type="email"
            name="email"
            required
        >
        <br><br>

        <label>Password</label>
        <br>
        <input
            type="password"
            name="password"
            required
        >
        <br><br>

        <label>Confirm Password</label>
        <br>
        <input
            type="password"
            name="confirm_password"
            required
        >
        <br><br>

        <button type="submit">
            Register
        </button>

    </form>

</body>
</html>
