<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invalid Link — Football Match Analytics Studio</title>
    <!-- Google Fonts: Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #080c0e;
            --bg-surface: #0f1519;
            --bg-card: rgba(18, 25, 30, 0.78);
            --border-glass: rgba(255, 255, 255, 0.08);
            --pitch-emerald: #10b981;
            --pitch-emerald-glow: rgba(16, 185, 129, 0.28);
            --pitch-cyan: #06b6d4;
            --accent-gradient: linear-gradient(135deg, #10b981 0%, #06b6d4 100%);
            --text-main: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --card-radius: 18px;
            --transition-smooth: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
            padding: 32px 20px;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(239, 68, 68, 0.08) 0%, transparent 60%),
                radial-gradient(circle at 100% 100%, rgba(6, 182, 212, 0.06) 0%, transparent 50%),
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 48px 48px, 48px 48px;
            pointer-events: none;
            z-index: 0;
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
            position: relative;
            z-index: 1;
            margin: auto;
            text-align: center;
        }

        .alert-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            border-radius: 20px;
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.35);
            box-shadow: 0 0 24px rgba(239, 68, 68, 0.25);
            margin-bottom: 20px;
        }

        .alert-badge svg {
            width: 32px;
            height: 32px;
            color: #ef4444;
        }

        .glass-card {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: var(--card-radius);
            padding: 36px 30px;
            box-shadow: 
                0 20px 40px -15px rgba(0, 0, 0, 0.6),
                0 0 1px 1px rgba(255, 255, 255, 0.05) inset;
        }

        .card-title {
            font-family: 'Outfit', sans-serif;
            font-size: 24px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 10px;
        }

        .card-desc {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.55;
            margin-bottom: 26px;
        }

        .btn-action {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            background: var(--accent-gradient);
            border: none;
            border-radius: 11px;
            padding: 13px;
            font-size: 14.5px;
            font-weight: 600;
            color: #041210;
            text-decoration: none;
            cursor: pointer;
            transition: var(--transition-smooth);
            box-shadow: 0 4px 18px var(--pitch-emerald-glow);
        }

        .btn-action:hover {
            transform: translateY(-1.5px);
            box-shadow: 0 6px 24px rgba(16, 185, 129, 0.45);
            filter: brightness(1.06);
        }

        .back-link {
            display: inline-block;
            margin-top: 18px;
            font-size: 13.5px;
            color: var(--text-secondary);
            text-decoration: none;
            transition: var(--transition-smooth);
        }

        .back-link:hover {
            color: var(--pitch-cyan);
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="glass-card">
            <div class="alert-badge">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
            </div>

            <h1 class="card-title">Invalid or Expired Link</h1>
            <p class="card-desc">
                This password reset link is invalid, has already been used, or has expired for your security. Please request a new link to proceed.
            </p>

            <a href="{% url 'accounts:forgot_password' %}" class="btn-action">
                Request New Reset Link
            </a>

            <div>
                <a href="{% url 'accounts:login' %}" class="back-link">
                    ← Return to Sign In
                </a>
            </div>
        </div>
    </div>
</body>
</html>
