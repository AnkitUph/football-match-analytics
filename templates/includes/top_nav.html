<header class="top-nav">
    <a href="{% url 'dashboard:index' %}" class="nav-brand">
        <div class="nav-logo-badge">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10" />
                <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20" />
                <path d="M2 12h20" />
            </svg>
        </div>
        <div class="nav-brand-text">
            <h1 class="title">MATCH STUDIO</h1>
            <p class="subtitle">TACTICAL AI PLATFORM</p>
        </div>
    </a>
    <nav class="nav-links">
        <a href="{% url 'dashboard:index' %}" class="nav-link {% if active_nav == 'dashboard' %}active{% endif %}">
            <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="7" height="7" rx="1"></rect>
                <rect x="14" y="3" width="7" height="7" rx="1"></rect>
                <rect x="14" y="14" width="7" height="7" rx="1"></rect>
                <rect x="3" y="14" width="7" height="7" rx="1"></rect>
            </svg>
            Dashboard
        </a>
        <a href="{% url 'matches:upload' %}" class="nav-link {% if active_nav == 'upload' %}active{% endif %}">
            <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
            </svg>
            Upload Match
        </a>
        <a href="{% url 'players:list' %}" class="nav-link {% if active_nav == 'players' %}active{% endif %}">
            <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
            </svg>
            Players
        </a>
        <a href="{% url 'teams:create' %}" class="nav-link {% if active_nav == 'teams' %}active{% endif %}">
            <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
            </svg>
            Teams
        </a>
        {% if user.is_authenticated %}
            <a href="{% url 'accounts:profile' %}" class="nav-link {% if active_nav == 'profile' %}active{% endif %}">
                <div class="user-avatar">{{ user.username|first|upper }}</div>
                Profile
            </a>
        {% else %}
            <a href="{% url 'accounts:login' %}" class="nav-link">Log In</a>
        {% endif %}
    </nav>
</header>
